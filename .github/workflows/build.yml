name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: server-26.3
          path: build/libs/*.jar
      # Start a dedicated server with the mod + Polymer, wait for "Done (", then stop it.
      - name: Server smoke test
        timeout-minutes: 10
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          mkfifo console
          ./gradlew runServer --console=plain < console > server.log 2>&1 &
          server=$!
          exec 3> console
          until grep -q 'Done (' server.log; do
            if ! kill -0 "$server" 2>/dev/null; then cat server.log; exit 1; fi
            sleep 5
          done
          echo stop >&3
          wait "$server" || { cat server.log; exit 1; }
          cat server.log
          ! grep -q 'Failed to load datapacks' server.log
          grep -q 'Via Recipe Fix' server.log
