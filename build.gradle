plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://repo.viaversion.com/" }
}

loom {
	accessWidenerPath = file("src/main/resources/via_recipe_fix.accesswidener")
}

dependencies {
	// Versions are set in gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings needed: Minecraft 26.3 is unobfuscated
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// ViaVersion is optional at runtime: the server brings it with ViaFabric.
	compileOnly "com.viaversion:viaversion-api:${project.viaversion_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version, "minecraft_version": inputs.properties.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
